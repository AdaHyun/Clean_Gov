# Non-secret LLM provider policy. Secrets and local model values belong in
# .env.local. The pipeline never writes secret values into generated configs.
default_provider: company

providers:
  company:
    enabled: true
    external: false
    api_style: openai_compatible
    base_url_env: COMPANY_LLM_BASE_URL
    model_env: COMPANY_LLM_MODEL
    api_key_env: COMPANY_LLM_API_KEY
    api_key_required: false
    endpoint: /chat/completions
    response_path: choices.0.message.content
    sampling_params:
      temperature: 0
      max_tokens: 1400

  siliconflow:
    enabled: true
    external: true
    api_style: openai_compatible
    base_url: https://api.siliconflow.cn/v1
    model_env: SILICONFLOW_MODEL
    api_key_env: SILICONFLOW_API_KEY
    endpoint: /chat/completions
    response_path: choices.0.message.content
    sampling_params:
      temperature: 0
      max_tokens: 1400
      response_format:
        type: json_object
